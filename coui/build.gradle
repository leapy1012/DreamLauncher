plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    id 'maven-publish'
}

def couiGroup = "com.coui.appcompat"
def couiArtifact = "coui"
def couiVersion = findProperty("COUI_VERSION") ?: "1.0.0"
def gprRepo = findProperty("GPR_REPO") ?: "leapy1012/MTKLauncher"

android {
    namespace = "com.coui.appcompat"

    defaultConfig {
        // Launcher currently ships on API 28+, while the two comparison devices are API 34+
        // and all vendor-specific calls in this source snapshot use compatibility wrappers.
        minSdk 28
        consumerProguardFiles 'proguard-consumer.flags'
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['java']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            manifest.srcFile 'AndroidManifest.xml'
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    kotlinOptions {
        jvmTarget = "17"
        languageVersion = "1.7"
        apiVersion = "1.7"
        freeCompilerArgs += ['-Xjvm-default=all-compatibility']
    }
}

dependencies {
    // Optional hidden-API stubs. Missing on CI / other machines; COUI already
    // vendors Oplus wrappers under java/android and java/oplus.
    def frameworkJar = file("${rootDir}/libs/framework.jar")
    def coreAllJar = file("${rootDir}/libs/core-all.jar")
    if (frameworkJar.exists()) {
        compileOnly files(frameworkJar)
    }
    if (coreAllJar.exists()) {
        compileOnly files(coreAllJar)
    }

    api libs.core
    api libs.collection
    api libs.appcompat
    api libs.fragment
    api libs.constraintlayout
    api libs.dynamicanimation
    api libs.preference
    api libs.recyclerview
    api libs.viewpager
    api libs.viewpager2
    api libs.material
    api libs.lottie

    // Nested into the AAR (libs/rebound-0.3.8.jar). Not a Maven coordinate.
    api files('libs/rebound-0.3.8.jar')
}

tasks.register("exportCouiAar") {
    group = "publishing"
    description = "Copy the release AAR to coui/dist for sharing with other projects."
    dependsOn("assembleRelease")
    def outDir = layout.projectDirectory.dir("dist")
    def outFile = outDir.file("coui-${couiVersion}.aar")
    outputs.file(outFile)
    doLast {
        def built = file("${layout.buildDirectory.get()}/outputs/aar/coui-release.aar")
        if (!built.exists()) {
            throw new GradleException("Missing ${built}. Run assembleRelease first.")
        }
        outDir.asFile.mkdirs()
        copy {
            from built
            into outDir.asFile
            rename { "coui-${couiVersion}.aar" }
        }
        file("${outDir.asFile}/USAGE.txt").text = """\
COUI AppCompat ${couiVersion}

Copy coui-${couiVersion}.aar into the other app's app/libs/ folder.

app/build.gradle:
    implementation files("libs/coui-${couiVersion}.aar")
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core:1.13.0"
    implementation "androidx.collection:collection:1.3.0"
    implementation "androidx.fragment:fragment:1.6.2"
    implementation "androidx.constraintlayout:constraintlayout:2.2.0-alpha13"
    implementation "androidx.dynamicanimation:dynamicanimation:1.1.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.recyclerview:recyclerview:1.2.1"
    implementation "androidx.viewpager:viewpager:1.0.0"
    implementation "androidx.viewpager2:viewpager2:1.0.0"
    implementation "com.google.android.material:material:1.7.0-alpha03"
    implementation "com.airbnb.android:lottie:6.0.0"

minSdk 28. Theme: @style/Theme.COUI
See coui/README.md in DreamLauncher for full notes.
"""
        logger.lifecycle("COUI AAR: ${outFile.asFile.absolutePath}")
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = couiGroup
                artifactId = couiArtifact
                version = couiVersion
                pom {
                    name = "COUI AppCompat"
                    description = "ColorOS COUI widgets for Android (Gradle AAR)."
                    url = "https://github.com/${gprRepo}"
                    licenses {
                        license {
                            name = "The Apache License, Version 2.0"
                            url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                        }
                    }
                }
            }
        }
        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/${gprRepo}")
                credentials {
                    username = findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR") ?: ""
                    password = findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN") ?: ""
                }
            }
        }
    }
}
